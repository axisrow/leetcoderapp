services:
  app:
    build:
      context: .
      args:
        EXPO_PUBLIC_ENV: local
        EXPO_PUBLIC_API_KEY: ${EXPO_PUBLIC_API_KEY}
    ports:
      - "3001:3001"
    environment:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: testuser
      DB_PASS: testpass
      DB_NAME: leetcoder
      JWT_SECRET: test-secret-key
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
